services:
  chess-trainer:
    build: .
    ports:
      - "127.0.0.1:43117:43117"
    environment:
      STOCKFISH_PATH: /usr/games/stockfish
      DATABASE_URL: postgres://chess:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/chess
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "--import", "./scripts/alias.mjs", "src/worker.ts"]
    environment:
      DATABASE_URL: postgres://chess:${POSTGRES_PASSWORD}@db:5432/chess
      CONTACT_URL: ${CONTACT_URL:-https://chess.addithurston.com}
    volumes:
      - lichess-cache:/app/.lichess-cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chess
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  lichess-cache:
